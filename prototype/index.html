<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Carbon Bank</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="top-nav">
            <div class="logo">
                <span class="leaf-icon">🌱</span> Home Carbon Bank
            </div>
            <div class="status-indicator" id="status-indicator">
                <div class="pulse-dot" id="pulse-dot"></div>
                <span id="stage-text">Normal</span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="grid-container">
            
            <!-- Left Column -->
            <div class="col-left">
                <!-- Budget Card -->
                <section class="card budget-card">
                    <h2>Monthly Carbon Budget</h2>
                    <div class="budget-display">
                        <span id="current-usage" class="huge-text">0</span>
                        <span class="sub-text">/ <span id="total-budget">300</span> kg CO₂e</span>
                    </div>
                    
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    
                    <div class="budget-stats">
                        <div>
                            <p class="stat-label">Predicted Usage</p>
                            <p class="stat-value" id="predicted-usage">0 kg</p>
                        </div>
                        <div>
                            <p class="stat-label">Budget Used</p>
                            <p class="stat-value" id="percent-used">0%</p>
                        </div>
                    </div>
                </section>

                <!-- AI Insight Card -->
                <section class="card insight-card">
                    <div class="card-header">
                        <h3>✨ IBM BOB Insight</h3>
                    </div>
                    <p class="insight-text" id="ai-insight-text">Analyzing household patterns...</p>
                    <button class="action-btn">Take Carbon Action</button>
                </section>
                
                <!-- Agent Log Card -->
                <section class="card log-card">
                    <div class="card-header">
                        <h3>🤖 Autonomous Agent Log</h3>
                    </div>
                    <ul class="log-list" id="agent-log">
                        <!-- Populated by JS -->
                    </ul>
                </section>
            </div>

            <!-- Right Column -->
            <div class="col-right">
                <!-- Appliances List -->
                <section class="card appliances-card">
                    <div class="card-header">
                        <h3>Connected Appliances</h3>
                    </div>
                    <div class="appliance-list" id="appliance-list">
                        <!-- Populated by JS -->
                    </div>
                </section>
            </div>

        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
